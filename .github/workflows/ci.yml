name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The self-hosting image (Dockerfile): Debian, Node 22, Chromium, the head built. The gate runs in it.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: pbcp-head
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker compose up -d --wait postgres
      - run: docker compose run --rm -T --no-deps head pnpm typecheck
      # The unit tests, the HTTP tests and the conformance gate, against a head the suite starts in the image.
      - run: docker compose run --rm -T head pnpm test:gate
