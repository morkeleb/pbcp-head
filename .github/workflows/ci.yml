name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm typecheck
      # Builds the head, then runs the unit tests, the HTTP tests and the conformance gate against it.
      - run: pnpm test
