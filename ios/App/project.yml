# The app's Xcode project, generated by XcodeGen (`xcodegen` in ios/App): the project file is not committed.
name: PBCP
options:
  bundleIdPrefix: app.pbcp
  deploymentTarget:
    iOS: "18.0"
packages:
  PBCP:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  PBCP:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pbcp.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brief
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.pbcp.sync]
    # The app sees the store and the client only through these modules; it does not depend on GRDB.
    dependencies:
      - package: PBCP
        product: PBCPModels
      - package: PBCP
        product: PBCPStore
      - package: PBCP
        product: PBCPClient
      - package: PBCP
        product: PBCPSync
