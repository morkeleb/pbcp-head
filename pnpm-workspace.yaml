# @pbcp/core and @pbcp/client come from the morkeleb/pbcp submodule at vendor/pbcp, pinned to
# v0.3.0 (merge commit e8521db). They are workspace packages here so that @pbcp/client's own
# `workspace:*` dependency on @pbcp/core resolves; `pnpm install` builds their dist via `prepare`.
# When the packages are on npm, drop these entries and depend on the published versions.
packages:
  - vendor/pbcp/packages/core
  - vendor/pbcp/packages/client
  # The owner's MCP server (stdio binary, and the tools /api/mcp serves).
  - packages/owner-mcp
onlyBuiltDependencies:
  - esbuild
  - sharp
  - puppeteer
